<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Aligning labels with event slices</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#4b5563">label[k]  &#8596;  k-th 1&#8201;ms slice of the event stream  =  events[ ms_to_idx[k] : ms_to_idx[k+1] ]</text>

  <!-- ms_to_idx values above boundaries -->
  <text x="40" y="92" text-anchor="end" font-size="12" fill="#6b7280">ms_to_idx:</text>
  <!-- boundaries at x = 70,190,310,430,550,670,790 ; values 0,3,7,10,14,18,21 -->
  <g font-size="12" fill="#2563eb" text-anchor="middle" font-weight="600">
    <text x="70" y="92">0</text>
    <text x="190" y="92">3</text>
    <text x="310" y="92">7</text>
    <text x="430" y="92">10</text>
    <text x="550" y="92">14</text>
    <text x="670" y="92">18</text>
    <text x="790" y="92">21</text>
  </g>

  <!-- ms boundary dashed lines -->
  <g stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4">
    <line x1="70" y1="100" x2="70" y2="250"/>
    <line x1="190" y1="100" x2="190" y2="250"/>
    <line x1="310" y1="100" x2="310" y2="250"/>
    <line x1="430" y1="100" x2="430" y2="250"/>
    <line x1="550" y1="100" x2="550" y2="250"/>
    <line x1="670" y1="100" x2="670" y2="250"/>
    <line x1="790" y1="100" x2="790" y2="250"/>
  </g>

  <!-- Event stream label -->
  <text x="40" y="124" text-anchor="end" font-size="12" fill="#374151" font-weight="600">events</text>
  <!-- event axis -->
  <line x1="70" y1="120" x2="790" y2="120" stroke="#374151" stroke-width="1.5"/>
  <!-- event dots: bins of 3,4,3,4,4,3 = 21 -->
  <g fill="#2563eb">
    <circle cx="95"  cy="120" r="4"/><circle cx="125" cy="120" r="4"/><circle cx="160" cy="120" r="4"/>
    <circle cx="210" cy="120" r="4"/><circle cx="238" cy="120" r="4"/><circle cx="265" cy="120" r="4"/><circle cx="292" cy="120" r="4"/>
    <circle cx="335" cy="120" r="4"/><circle cx="365" cy="120" r="4"/><circle cx="400" cy="120" r="4"/>
    <circle cx="450" cy="120" r="4"/><circle cx="478" cy="120" r="4"/><circle cx="505" cy="120" r="4"/><circle cx="532" cy="120" r="4"/>
    <circle cx="570" cy="120" r="4"/><circle cx="598" cy="120" r="4"/><circle cx="625" cy="120" r="4"/><circle cx="652" cy="120" r="4"/>
    <circle cx="695" cy="120" r="4"/><circle cx="725" cy="120" r="4"/><circle cx="760" cy="120" r="4"/>
  </g>

  <!-- 1 ms bracket on first bin -->
  <line x1="70" y1="138" x2="190" y2="138" stroke="#6b7280" stroke-width="1"/>
  <line x1="70" y1="134" x2="70" y2="142" stroke="#6b7280" stroke-width="1"/>
  <line x1="190" y1="134" x2="190" y2="142" stroke="#6b7280" stroke-width="1"/>
  <text x="130" y="154" text-anchor="middle" font-size="11" fill="#6b7280">1&#8201;ms</text>

  <!-- Slice boxes -->
  <g>
    <rect x="72" y="178" width="116" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <rect x="192" y="178" width="116" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <rect x="312" y="178" width="116" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <rect x="432" y="178" width="116" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <rect x="552" y="178" width="116" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
    <rect x="672" y="178" width="116" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle">
    <g font-size="13" font-weight="700" fill="#1e40af">
      <text x="130" y="200">slice 0</text><text x="250" y="200">slice 1</text><text x="370" y="200">slice 2</text>
      <text x="490" y="200">slice 3</text><text x="610" y="200">slice 4</text><text x="730" y="200">slice 5</text>
    </g>
    <g font-size="10.5" fill="#3b82f6">
      <text x="130" y="216">[0:3]</text><text x="250" y="216">[3:7]</text><text x="370" y="216">[7:10]</text>
      <text x="490" y="216">[10:14]</text><text x="610" y="216">[14:18]</text><text x="730" y="216">[18:21]</text>
    </g>
  </g>

  <!-- arrows slice -> label -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
  </defs>
  <g stroke="#059669" stroke-width="1.6" marker-end="url(#arr)">
    <line x1="130" y1="228" x2="130" y2="296"/>
    <line x1="250" y1="228" x2="250" y2="296"/>
    <line x1="370" y1="228" x2="370" y2="296"/>
    <line x1="490" y1="228" x2="490" y2="296"/>
    <line x1="610" y1="228" x2="610" y2="296"/>
    <line x1="730" y1="228" x2="730" y2="296"/>
  </g>

  <!-- Label boxes -->
  <g>
    <rect x="72" y="300" width="116" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <rect x="192" y="300" width="116" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <rect x="312" y="300" width="116" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <rect x="432" y="300" width="116" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <rect x="552" y="300" width="116" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <rect x="672" y="300" width="116" height="44" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">
    <text x="130" y="327">label[0]</text><text x="250" y="327">label[1]</text><text x="370" y="327">label[2]</text>
    <text x="490" y="327">label[3]</text><text x="610" y="327">label[4]</text><text x="730" y="327">label[5]</text>
  </g>
  <text x="40" y="327" text-anchor="end" font-size="12" fill="#374151" font-weight="600">labels</text>

  <!-- highlight first correspondence -->
  <rect x="72" y="300" width="116" height="44" rx="6" fill="none" stroke="#065f46" stroke-width="2.4"/>
  <text x="130" y="362" text-anchor="middle" font-size="10.5" fill="#065f46">first label &#8596; first 1&#8201;ms</text>

  <!-- bottom note -->
  <text x="450" y="404" text-anchor="middle" font-size="13" fill="#374151">
    ms_to_idx[k] = searchsorted(events/t / 1e3, k)  &#8212;  index of the first event in millisecond k
  </text>
  <text x="450" y="428" text-anchor="middle" font-size="12.5" fill="#6b7280">
    Accumulate a W&#8209;ms frame ending at label k:  events[ ms_to_idx[k&#8722;W+1] : ms_to_idx[k+1] ]
  </text>
</svg>
