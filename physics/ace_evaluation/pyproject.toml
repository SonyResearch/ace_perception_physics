[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ace-evaluation"
version = "0.1.0"
description = "Table-tennis physics evaluation toolkit — data plotting, HDF5 processing, and aerodynamics analysis"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "h5py>=3.0.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "scikit-learn>=1.0.0",
    "onnxruntime>=1.12.0",
    "tqdm>=4.60.0",
    "plotly>=5.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
    "pyqtgraph>=0.13.0",
]

[project.scripts]
ace-data-plotter = "data_plotter.app:main"

[tool.setuptools.packages.find]
include = ["ace_evaluation*", "data_plotter*"]

[tool.setuptools.package-data]
ace_evaluation = ["models/*.onnx"]
