# invalid cases

wrong_pid: # wrong pid set in gtest
  policy: SCHED_OTHER

wrong_cpu:
  affinity: [123]

wrong_policy:
  policy: foo

missing_priority:
  policy: SCHED_RR

affinity_not_list:
  affinity: 0

affinity_negative:
  affinity: [0, -1, 2]

policy_not_string:
  policy: [SCHED_FIFO]

priority_not_int:
  policy: SCHED_FIFO
  priority: 0.1
