__search_paths__:
  - "${package:trajectory_estimation}/config"
  - "${package:arena_native}/parameters"
defaults:
  - _self_
  - parameters_default.yaml
  - transformer_parameters_v4.yaml
  - phys_transformer_parameters_v1.yaml

# Set to false if you want it to be executed in sync mode
is_async: True

# Rollback ekf setting
use_rollback_estimator: False
estimator_type: ekf

min_num_pos_measurements: 5
min_num_spin_measurements: 1
enable_rk4: False

deployment_mode: false
rt_profile: trajectory_estimator_ace_monitor

reset_condition:
  - condition_type: time_discontinuity
    max_diff: 0.2 # time in seconds
  # - condition_type: table_contact
  - condition_type: distance_discontinuity
    max_diff: 0.4 # distance in meters
  # - condition_type: racket_contact
