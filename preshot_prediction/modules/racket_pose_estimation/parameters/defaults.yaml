

capture:
  worker_queue_length: 2
  camera_buffer_length: 2
  use_variable_response_time: true
  left_hand: 0
  right_hand: 1

extractor:
  device_index: 0
  max_batch_size: 6
  opt_batch_size: 3
  outdated_diff: 16
  workers_count: 3
  confidence_threshold: 0.7
  nms_threshold: 0.8
  sampling: 2
  history_difference: 10 # max sequence ID difference
  latest_weight: 0.95
  rt_profile: racket_pose_extractor
  roi: [320,320]
  debug_output: false

fitter:
  max_delta_err_reset: 0
  max_skips_reset: 10
  max_error: 4e-3
  max_iterations: 3500
  initial_rate: 5e-2
  min_axis_length: 0

triangulation:
  covariance_model: metric
  geometric_error_threshold: 1.5
  radius_error_threshold: 0.15
  observation_variance: 0.04
  nonlinear_refinement:
    use: true
    tol_position: 1e-10
    tol_reprojection_error: 1e-8
    max_iterations: 100
